[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "--strict-markers -q"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = "tests"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 80
